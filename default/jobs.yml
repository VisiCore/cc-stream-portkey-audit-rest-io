vct_portkey_audit_logs:
  type: collection
  description: Portkey Admin API audit logs (GET /v1/audit-logs), 100/page, state-tracked on timestamp. Events flow to the pack routes. Set vct_portkey_org_id + the group secret before enabling the schedule.
  ttl: 4h
  ignoreGroupJobsLimit: false
  removeFields: []
  resumeOnBoot: false
  streamtags:
  - vct
  - portkey
  workerAffinity: false
  schedule:
    enabled: false
    cronSchedule: '*/15 * * * *'
    tz: UTC
    maxConcurrentRuns: 1
    skippable: true
    run:
      mode: run
      rescheduleDroppedTasks: true
      maxTaskReschedule: 1
      logLevel: info
      jobTimeout: 30m
      timeRangeType: relative
      earliest: -1h
      latest: now
      timestampTimezone: UTC
      expression: _time > (__collectible.state.latestTime || 0)
      minTaskSize: 1MB
      maxTaskSize: 10MB
      stateTracking:
        enabled: true
        stateUpdateExpression: '__timestampExtracted !== false && {latestTime: (state.latestTime || 0) > _time ? state.latestTime : _time}'
        stateMergeExpression: '(prevState.latestTime || 0) > newState.latestTime ? prevState : newState'
  collector:
    type: rest
    destructive: false
    encoding: utf8
    conf:
      discovery:
        discoverType: none
      collectMethod: get
      collectUrl: '`${C.vars.vct_portkey_api_base}/audit-logs`'
      collectRequestParams:
      - name: organisation_id
        value: C.vars.vct_portkey_org_id
      - name: start_time
        value: '`${new Date(((typeof state !== ''undefined'' && state && state.latestTime) ? state.latestTime : (earliest || Date.now()/1000 - 3600)) * 1000).toISOString()}`'
      - name: end_time
        value: '`${new Date((latest || Date.now()/1000) * 1000).toISOString()}`'
      collectRequestHeaders:
      - name: x-portkey-api-key
        value: C.Secret(C.vars.vct_portkey_secret_id, 'text').value
      - name: Accept
        value: '''application/json'''
      authentication: none
      pagination:
        type: request_page
        pageField: current_page
        sizeField: page_size
        size: 100
        zeroIndexed: true
        totalRecordField: total
        maxPages: 0
      timeout: 60
      useRoundRobinDns: false
      disableTimeFilter: false
      decodeUrl: true
      rejectUnauthorized: true
      captureHeaders: false
      stopOnEmptyResults: true
      safeHeaders: []
      retryRules:
        type: backoff
        interval: 1000
        limit: 5
        multiplier: 2
        maxIntervalMs: 20000
        codes:
        - 429
        - 503
        enableHeader: true
        retryHeaderName: retry-after
        retryConnectTimeout: false
        retryConnectReset: false
      __scheduling:
        stateTracking: {}
  input:
    type: collection
    staleChannelFlushMs: 10000
    sendToRoutes: true
    preprocess:
      disabled: true
    throttleRatePerSec: '0'
    breakerRulesets:
    - vct-portkey-audit-logs
    metadata:
    - name: datatype
      value: '''portkey_audit_log'''
    - name: source
      value: '''portkey:audit-logs'''
  savedState: {}
  notifications: []
