vct_portkey_org_id:
  type: string
  value: "'11111111-1111-1111-1111-111111111111'"
  description: Portkey organisation id (shown as organisation_id on every audit record)
  tags: vct,portkey
vct_portkey_secret_id:
  type: string
  value: "'vct-portkey-rest-secret'"
  description: Group-level text secret holding the Portkey Admin API key (packs
    cannot contain secrets)
  tags: vct,portkey
vct_portkey_api_base:
  type: string
  value: "'https://api.portkey.ai/v1'"
  description: Portkey control-plane API base; change for a self-hosted control plane
  tags: vct,portkey
